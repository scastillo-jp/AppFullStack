<!DOCTYPE html>

<head>

	<link rel="stylesheet" href="styles.css">

<body>
	<div class="user-info">
		<a href="acceso.html">
			<button class="btn-tipo-1"> Iniciar sesión</button>
		</a>
		<button class="btn-tipo-3"> Cerrar sesión</button>

		<div class="usuario-autorizado">
			<p>Nombre del usuario</p>
			<img class="user-icon" src="../assets/logos/user.png" alt="user.png">
		</div>
	</div>

	<header>
		<a href="index.html">
			<img class="store-logo" src="../assets/logos/logo.png" alt="logo.png">

		<nav>
			<ul class="nav-items">
				<li><a href="index.html">Landing Page</a></li>
