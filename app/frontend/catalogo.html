<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Catálogo</title>
	<link rel="stylesheet" href="styles.css">
	<link rel="icon" href="../assets/logos/logo.png">
</head>

<body>
	<div class="user-info">
		<a id="login-link" class="btn-tipo-1" href="acceso.html">Iniciar sesión</a>
		<button id="logout-button" class="btn-tipo-3" type="button" hidden>Cerrar sesión</button>
		<div class="usuario-autorizado" hidden>
			<p></p>
			<img class="user-icon" src="../assets/logos/user.png" alt="Usuario">
		</div>
	</div>
	<header>
		<a href="index.html"><img class="store-logo" src="../assets/logos/logo.png" alt="Tienda"></a>
		<nav>
			<ul class="nav-items">
				<li><a href="index.html">Inicio</a></li>
				<li><a href="catalogo.html" aria-current="page">Catálogo</a></li>
				<li><a href="mis-pedidos.html">Mis pedidos</a></li>
				<li><a href="carrito.html">Carrito</a></li>
			</ul>
		</nav>
	</header>

	<main>
		<section class="busqueda-productos-seccion">
			<div>
				<h1 class="color-blanco txt-center">Catálogo de productos</h1>
				<form class="catalogo-filtros" id="filtros-form">
					<input class="campo-texto mt-20" id="busqueda" type="search"
						placeholder="Buscar productos..." aria-label="Buscar productos">
					<select class="campo-texto mt-10" id="filtro-categoria" aria-label="Filtrar por categoría">
						<option value="">Todas las categorías</option>
					</select>
					<button class="btn-tipo-1 btn-size-1" type="submit">Buscar</button>
				</form>
			</div>
		</section>

		<section class="productos-section catalogo-productos-section">
			<p class="mt-5">Explora nuestra gama de productos.</p>
			<div class="productos-container-items" id="productos-catalogo"></div>
			<p id="catalogo-mensaje" role="status" hidden></p>
		</section>
	</main>

	<footer>
		<p>2026 Mi tienda en línea. Todos los derechos reservados.</p>
	</footer>

	<script src="store.js"></script>
	<script>
		const productsContainer = document.querySelector("#productos-catalogo");
		const filtersForm = document.querySelector("#filtros-form");
		const searchInput = document.querySelector("#busqueda");
		const categoryFilter = document.querySelector("#filtro-categoria");
		const message = document.querySelector("#catalogo-mensaje");

		async function loadProducts() {
			const params = new URLSearchParams();
			if (searchInput.value.trim()) params.set("search", searchInput.value.trim());
			if (categoryFilter.value) params.set("category_id", categoryFilter.value);
			Store.showMessage(message, "");
			try {
				const products = await Store.request(`/productos?${params}`);
				Store.renderProductCards(productsContainer, products);
			} catch (error) {
				Store.showMessage(message, error.message);
			}
		}

		async function iniciarCatalogo() {
			const user = await Store.requireAuth();
			if (!user) return;
			try {
				const categories = await Store.request("/categorias");
				for (const category of categories) {
					const option = document.createElement("option");
					option.value = category.id;
					option.textContent = category.name;
					categoryFilter.append(option);
				}
				const query = new URLSearchParams(location.search);
				searchInput.value = query.get("search") || "";
				categoryFilter.value = query.get("category_id") || "";
				await loadProducts();
			} catch (error) {
				Store.showMessage(message, error.message);
			}
		}

		filtersForm.addEventListener("submit", (event) => {
			event.preventDefault();
			loadProducts();
		});
		categoryFilter.addEventListener("change", loadProducts);
		iniciarCatalogo();
	</script>
</body>

</html>
