<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tienda en línea</title>
	<link rel="stylesheet" href="styles.css">
	<link rel="icon" href="../assets/logos/logo.png">
</head>

<body>
	<div class="user-info">
		<a id="login-link" class="btn-tipo-1" href="acceso.html">Iniciar sesión</a>
		<button id="logout-button" class="btn-tipo-6" type="button" hidden>Cerrar sesión</button>
		<div class="usuario-autorizado" hidden>
			<p></p>
			<img class="user-icon" src="../assets/logos/login-ok-2.png" alt="Usuario">
		</div>
	</div>

	<header>
		<a href="index.html">
			<img class="store-logo" src="../assets/logos/logo.png" alt="Tienda">
		</a>
		<nav>
			<ul class="nav-items">
				<li><a href="index.html" aria-current="page">Inicio</a></li>
				<li><a href="catalogo.html">Catálogo</a></li>
				<li><a href="mis-pedidos.html">Mis pedidos</a></li>
				<li><a href="carrito.html">Carrito</a></li>
			</ul>
		</nav>
	</header>

	<main>
		<section class="busqueda-productos-seccion">
			<div class="txt-center">
				<h1 class="color-blanco mb-20">Descubre la mejor tecnología y estilo para tu día a día.</h1>
				<form id="busqueda-form">
					<input class="barra-busqueda campo-texto" id="busqueda" type="search"
						placeholder="Buscar productos..." aria-label="Buscar productos">
					<button class="btn-tipo-1 btn-size-1" type="submit">Buscar</button>
				</form>
			</div>
		</section>

		<section class="categorias-seccion">
			<h2>Categorías</h2>
			<div class="categorias-container" id="categorias-container"></div>
			<p id="categorias-mensaje" role="status" hidden></p>
		</section>

		<section class="productos-section">
			<h2 class="mt-20 mb-10">Productos destacados</h2>
			<div class="productos-container-items" id="productos-destacados"></div>
			<!-- <h2 class="mt-20 mb-10">Más productos</h2> -->
			<!-- <div class="productos-container-items" id="productos-lista"></div> -->
			<p id="inicio-mensaje" role="status" hidden></p>
		</section>
	</main>

	<footer>
		<p>2026 Mi tienda en línea. Todos los derechos reservados.</p>
	</footer>

	<script src="store.js"></script>
	<script>
		async function iniciarInicio() {
			const user = await Store.requireAuth();
			if (!user) return;
			await Promise.all([cargarProductos(), cargarCategorias()]);
		}

		async function cargarProductos() {
			try {
				const products = await Store.request("/productos");
				const shuffled = [...products].sort(() => Math.random() - 0.5);
				Store.renderProductCards(
					document.querySelector("#productos-destacados"),
					shuffled.slice(0, 4)
				);
			} catch (error) {
				Store.showMessage(document.querySelector("#inicio-mensaje"), error.message);
			}
		}

		async function cargarCategorias() {
			try {
				const categories = await Store.request("/categorias");
				Store.renderCategories(
					document.querySelector("#categorias-container"),
					categories
				);
			} catch (error) {
				Store.showMessage(document.querySelector("#categorias-mensaje"), error.message);
			}
		}

		document.querySelector("#busqueda-form").addEventListener("submit", (event) => {
			event.preventDefault();
			const search = document.querySelector("#busqueda").value.trim();
			location.assign(`catalogo.html?search=${encodeURIComponent(search)}`);
		});
		iniciarInicio();
	</script>
</body>

</html>
