<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Acceso de Usuario</title>
	<link rel="stylesheet" href="styles.css">
	<link rel="icon" href="../assets/logos/logo.png">
</head>

<body>
	<main class="acceso-page">
		<section class="acceso-panel" id="inicio-sesion" aria-labelledby="inicio-sesion-titulo">
			<h1 id="inicio-sesion-titulo">Bienvenido de nuevo</h1>
			<p class="acceso-subtitulo">Ingresa tus datos para acceder</p>

			<form class="acceso-form">
				<div class="acceso-campo">
					<label for="email">Correo Electrónico</label>
					<input class="campo-texto" type="email" id="email" name="email" placeholder="tu@email.com"
						autocomplete="email" required>
				</div>
				<div class="acceso-campo">
					<label for="password">Contraseña</label>
					<input class="campo-texto" type="password" id="password" name="password" placeholder="••••••••"
						autocomplete="current-password" required>
				</div>
				<button type="submit" class="btn-tipo-1 btn-size-1">Iniciar Sesión</button>
			</form>

			<p class="acceso-cambio">¿No tienes cuenta?
				<a href="#registro" data-mostrar="registro">Regístrate aquí</a>
			</p>
		</section>

		<section class="acceso-panel" id="registro" aria-labelledby="registro-titulo" hidden>
			<h1 id="registro-titulo">Crea tu cuenta</h1>
			<p class="acceso-subtitulo">Únete para empezar a comprar</p>

			<form class="acceso-form">
				<div class="acceso-campo">
					<label for="nombre">Nombre Completo</label>
					<input class="campo-texto" type="text" id="nombre" name="nombre" placeholder="Juan Pérez"
						autocomplete="name" required>
				</div>
				<div class="acceso-campo">
					<label for="email-registro">Correo Electrónico</label>
					<input class="campo-texto" type="email" id="email-registro" name="email-registro"
						placeholder="tu@email.com"
						autocomplete="email" required>
				</div>
				<div class="acceso-campo">
					<label for="password-registro">Contraseña</label>
					<input class="campo-texto" type="password" id="password-registro" name="password-registro"
						placeholder="••••••••"
						autocomplete="new-password" required>
				</div>
				<div class="acceso-campo">
					<label for="telefono">Teléfono</label>
					<input class="campo-texto" type="tel" id="telefono" name="telefono" placeholder="(123) 456-7890"
						autocomplete="tel" required>
				</div>
				<div class="acceso-campo">
					<label for="direccion">Dirección</label>
					<input class="campo-texto" type="text" id="direccion" name="direccion" placeholder="Calle 123, Ciudad"
						autocomplete="street-address" required>
				</div>
				<div class="acceso-campo">
					<label for="cedula">Cédula</label>
					<input class="campo-texto" type="text" id="cedula" name="cedula" placeholder="123456789"
						autocomplete="off" required>
				</div>
				<button type="submit" class="btn-tipo-1 btn-size-1">Registrarse</button>
			</form>

			<p class="acceso-cambio">¿Ya tienes cuenta?
				<a href="#inicio-sesion" data-mostrar="inicio-sesion">Inicia sesión</a>
			</p>
		</section>
	</main>
	
	<script>
		const formularios = document.querySelectorAll(".acceso-panel");

		document.querySelectorAll("[data-mostrar]").forEach((enlace) => {
			enlace.addEventListener("click", (evento) => {
				evento.preventDefault();
				const vistaActiva = enlace.dataset.mostrar;

				formularios.forEach((formulario) => {
					formulario.hidden = formulario.id !== vistaActiva;
				});

				document.getElementById(vistaActiva).querySelector("input").focus();
			});
		});
	</script>
</body>
</html>
